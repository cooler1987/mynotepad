[package]
name = "notepad_lite"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "NotepadLite"
path = "main.rs"

[dependencies]
encoding_rs = "0.8"
chardetng = "0.1"
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
panic = "unwind"
lto = true
codegen-units = 1
strip = true
